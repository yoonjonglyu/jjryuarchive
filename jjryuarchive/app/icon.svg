<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1F26" />
      <stop offset="100%" stop-color="#0C0C0C" />
    </radialGradient>
  </defs>
  <!-- Background Circle: Deep Muk with subtle border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#917D47" stroke-width="2" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#D9C58F" stroke-width="0.8" opacity="0.6" stroke-dasharray="2 2" />
  
  <!-- Hanja Character '柳' (Ryu / 버들 류) styled with classical dignity -->
  <text 
    x="32" 
    y="40" 
    text-anchor="middle" 
    font-family="'Noto Serif KR', 'Batang', 'Songti SC', serif" 
    font-size="28" 
    font-weight="bold" 
    fill="#F6F5F2" 
    letter-spacing="-1">
    柳
  </text>
  
  <!-- Subtle accent dot (Wu Xing Wood Element) -->
  <circle cx="32" cy="14" r="1.5" fill="#3E6586" />
</svg>
